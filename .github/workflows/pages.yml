name: Deploy demo to GitHub Pages

# Builds the storefront against the live API on Render (render.yaml) and
# publishes it at https://zakilhg.github.io/PitchKit/. To publish a version
# with no backend instead, build with VITE_DEMO: "true" (see the README).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  API_ORIGIN: https://pitchkit-admin.onrender.com

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Client
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Client/package-lock.json

      - run: npm ci

      - name: Build against the live API
        run: npm run build
        env:
          BASE_PATH: /PitchKit/
          VITE_API_BASE_URL: ${{ env.API_ORIGIN }}/api
          VITE_ASSET_BASE_URL: ${{ env.API_ORIGIN }}

      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: Client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
