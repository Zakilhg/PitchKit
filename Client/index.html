<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Shop football jerseys from clubs and leagues around the world."
    />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Pick the theme before first paint: a saved choice, else the system setting.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem("pitchkit.theme");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <style>
      /* Boot splash + the kick animation (also used by the in-app loader, KickScene.jsx). */
      .boot { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; background: #fff; color: #171717; }
      [data-theme="dark"] .boot { background: #0a0a0a; color: #fafafa; }
      .boot-label { font: 500 10px/1 ui-monospace, monospace; letter-spacing: 0.3em; text-transform: uppercase; opacity: 0.55; }

      .kick { width: 240px; overflow: visible; --kick-ink: #171717; --kick-paper: #fff; }
      [data-theme="dark"] .kick { --kick-ink: #fafafa; --kick-paper: #0a0a0a; }
      .kick-fill { fill: var(--kick-ink); }
      .kick-cut { fill: var(--kick-paper); }
      .kick-eye { fill: #22c55e; }
      .kick-lines { opacity: 0.3; }
      .kick * { transform-box: fill-box; }
      .kick-player { transform-origin: 70% 100%; animation: kick-player 3.2s infinite; }
      .kick-body { transform-origin: 35% 100%; animation: kick-body 3.2s infinite; }
      .kick-leg { transform-origin: 50% 0%; animation: kick-leg 3.2s infinite; }
      .kick-pshadow { fill: currentColor; opacity: 0.25; transform-origin: center; animation: kick-pshadow 3.2s infinite; }
      .kick-burst { stroke: #22c55e; opacity: 0; transform-origin: 0% 50%; animation: kick-burst 3.2s infinite; }
      .kick-x { animation: kick-x 3.2s infinite; }
      .kick-y { animation: kick-y 3.2s infinite; }
      .kick-ball { opacity: 0; transform-origin: center; animation: kick-ball 3.2s infinite; }
      .kick-spin { transform-origin: center; animation: kick-spin 3.2s infinite; }
      .kick-shadow { fill: currentColor; opacity: 0; transform-origin: center; animation: kick-shadow 3.2s infinite; }
      .kick-net { opacity: 0.55; transform-origin: 0% 50%; animation: kick-net 3.2s infinite; }
      .kick-ring { stroke: #22c55e; opacity: 0; transform-origin: center; animation: kick-ring 3.2s infinite; }

      /* 0-6% the P-player steps in · 8-22% wind-up · 22-26% kick ·
         26-31% the player turns into the ball · 30-62% flight · 62-84% goal · fade. */
      @keyframes kick-player {
        0% { opacity: 0; transform: scale(0.4); }
        6%, 25% { opacity: 1; transform: scale(1); }
        31%, 100% { opacity: 0; transform: scale(0.15); }
      }
      @keyframes kick-body {
        0%, 8% { transform: rotate(0deg); }
        20%, 22% { transform: rotate(-10deg); animation-timing-function: cubic-bezier(0.5, 0, 0.2, 1); }
        26%, 100% { transform: rotate(12deg); }
      }
      @keyframes kick-leg {
        0%, 8% { transform: rotate(0deg); animation-timing-function: cubic-bezier(0.4, 0, 0.3, 1); }
        21% { transform: rotate(48deg); animation-timing-function: cubic-bezier(0.7, 0, 0.2, 1); }
        25.5%, 100% { transform: rotate(-72deg); }
      }
      @keyframes kick-pshadow {
        0% { opacity: 0; }
        6%, 25% { opacity: 0.25; transform: scale(1); }
        31%, 100% { opacity: 0; transform: scale(0.3); }
      }
      @keyframes kick-burst {
        0%, 24% { opacity: 0; transform: scale(0.5); }
        26% { opacity: 1; transform: scale(0.9); }
        36%, 100% { opacity: 0; transform: scale(1.5); }
      }
      @keyframes kick-ball {
        0%, 24% { opacity: 0; transform: scale(0.2); }
        28% { opacity: 1; transform: scale(1.25); }
        32%, 84% { opacity: 1; transform: scale(1); }
        94%, 100% { opacity: 0; transform: scale(0.6); }
      }
      @keyframes kick-x {
        0%, 28% { transform: translateX(0); animation-timing-function: cubic-bezier(0.25, 0.6, 0.45, 1); }
        62%, 100% { transform: translateX(123px); }
      }
      @keyframes kick-y {
        0%, 28% { transform: translateY(0); animation-timing-function: cubic-bezier(0.2, 0.7, 0.4, 1); }
        45% { transform: translateY(-36px); animation-timing-function: cubic-bezier(0.6, 0, 0.8, 0.4); }
        62%, 100% { transform: translateY(-18px); }
      }
      @keyframes kick-spin {
        0%, 28% { transform: rotate(0deg); animation-timing-function: cubic-bezier(0.2, 0.6, 0.4, 1); }
        62%, 100% { transform: rotate(540deg); }
      }
      @keyframes kick-shadow {
        0%, 27% { opacity: 0; transform: scale(1); }
        30% { opacity: 0.25; transform: scale(1); }
        45% { opacity: 0.08; transform: scale(0.35); }
        62%, 84% { opacity: 0.18; transform: scale(0.75); }
        94%, 100% { opacity: 0; }
      }
      @keyframes kick-net {
        0%, 61% { transform: scaleX(1); }
        67% { transform: scaleX(1.5); }
        76% { transform: scaleX(0.9); }
        84%, 100% { transform: scaleX(1); }
      }
      @keyframes kick-ring {
        0%, 61% { opacity: 0; transform: scale(0.3); }
        64% { opacity: 0.9; }
        86%, 100% { opacity: 0; transform: scale(2.4); }
      }
      @media (prefers-reduced-motion: reduce) {
        .kick * { animation: none !important; }
        .kick-ball, .kick-shadow, .kick-burst, .kick-ring { display: none; }
      }
    </style>
    <title>PitchKit | Football jerseys</title>
  </head>
  <body>
    <div id="root">
      <!-- Boot splash: shown only until React replaces #root. Generated with KickScene.jsx; keep them in sync. -->
      <div class="boot" aria-hidden="true">
        <svg viewBox="0 0 184 100" class="kick" aria-hidden="true">
          <g class="kick-lines" fill="none" stroke="currentColor" stroke-width="1.2">
            <rect x="6" y="12" width="160" height="76" rx="2" />
            <path d="M86 12V88" />
            <circle cx="86" cy="50" r="12" />
            <path d="M6 32H24V68H6" />
            <path d="M166 32H148V68H166" />
          </g>
          <g class="kick-net" fill="none" stroke="currentColor">
            <path d="M166 40H178V60H166" stroke-width="1.2" />
            <path d="M170 40V60M174 40V60M166 45H178M166 50H178M166 55H178" stroke-width="0.5" />
          </g>
          <circle class="kick-ring" cx="172" cy="50" r="8" fill="none" stroke-width="1.5" />
          <g transform="translate(40 66)">
            <ellipse class="kick-pshadow" cx="-2" cy="10" rx="7" ry="1.6" />
            <g class="kick-player">
              <g class="kick-body">
                <rect class="kick-leg kick-fill" x="-5" y="-4" width="4" height="13" rx="1.6" />
                <path class="kick-fill" d="M-5 -16H1.5A7 7 0 0 1 1.5 -2H-5Z" />
                <circle class="kick-eye" cx="1.6" cy="-9" r="1.8" />
              </g>
            </g>
            <g class="kick-burst" stroke-width="1.5" stroke-linecap="round">
              <path d="M15 -1L20 -4M16 3H22M15 7L20 10" />
            </g>
            <g transform="translate(9 2)">
              <g class="kick-x">
                <ellipse class="kick-shadow" cx="0" cy="7" rx="5" ry="1.4" />
                <g class="kick-y">
                  <g class="kick-ball">
                    <g class="kick-spin">
                      <circle r="6.5" class="kick-fill" />
                      <path class="kick-cut" d="M-3 -3.6H0.4A2.3 2.3 0 0 1 0.4 1H-1.3V3.8H-3Z" />
                      <circle class="kick-eye" cx="0.5" cy="-1.3" r="0.9" />
                    </g>
                  </g>
                </g>
              </g>
            </g>
          </g>
        </svg>
        <span class="boot-label">PitchKit</span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
