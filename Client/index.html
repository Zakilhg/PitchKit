<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Shop football jerseys from clubs and leagues around the world."
    />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Pick the theme before first paint: a saved choice, else the system setting.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem("pitchkit.theme");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <style>
      .boot { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 18px; background: #fff; }
      .boot-bg { fill: #171717; } .boot-fg { fill: #fff; }
      .boot-bar { width: 96px; height: 2px; overflow: hidden; border-radius: 2px; background: #e5e5e5; }
      .boot-bar > span { display: block; width: 40%; height: 100%; background: #171717; animation: boot 1s ease-in-out infinite; }
      [data-theme="dark"] .boot { background: #0a0a0a; }
      [data-theme="dark"] .boot-bg { fill: #fafafa; } [data-theme="dark"] .boot-fg { fill: #0a0a0a; }
      [data-theme="dark"] .boot-bar { background: #262626; } [data-theme="dark"] .boot-bar > span { background: #fafafa; }
      @keyframes boot { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .boot-bar > span { animation: none; } }
    </style>
    <title>PitchKit | Football jerseys</title>
  </head>
  <body>
    <div id="root">
      <!-- Boot splash: shown only until React replaces #root. -->
      <div class="boot" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="40" height="40">
          <rect width="24" height="24" rx="6" class="boot-bg" />
          <path d="M7 6.5h6.2a4.3 4.3 0 0 1 0 8.6H10V18H7z" class="boot-fg" />
          <circle cx="13" cy="10.8" r="1.6" fill="#22c55e" />
        </svg>
        <span class="boot-bar"><span></span></span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
